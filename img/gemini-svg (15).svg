<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .layout-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-cross { stroke: #000000; stroke-width: 1.5; }
      .image-border-thick { stroke: #000000; stroke-width: 4; fill: none; }
      .headline { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: start; }
      .text-column { fill: #e0e0e0; stroke: none; }
      .tag-good { fill: #bf1e2e; }
      .tag-text { fill: #ffffff; font-family: sans-serif; font-weight: bold; font-size: 12px; text-anchor: middle; }
    </style>
  </defs>

  <g id="layout-1" data-type="layout" data-variant="balanced-u-shape"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-2" data-type="layout" data-variant="balanced-wrap"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-3" data-type="layout" data-variant="sidesaddle-left"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-4" data-type="layout" data-variant="sidesaddle-stack"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-5" data-type="layout" data-variant="l-shape"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-6" data-type="layout" data-variant="u-shape"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-7" data-type="layout" data-variant="raw-wrap"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-8" data-type="layout" data-variant="text-wrap-weak"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-9" data-type="layout" data-variant="directional-left-photo"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>

  <g id="layout-10" data-type="layout" data-variant="vertical-impact-photo">
    <rect x="420" y="50" width="360" height="1500" class="layout-bg" />
    
    <g data-type="image" class="image-container">
      <rect x="445" y="75" width="310" height="885" class="image-placeholder" />
      <line x1="445" y1="75" x2="755" y2="960" class="image-cross" />
      <line x1="755" y1="75" x2="445" y2="960" class="image-cross" />
      <line x1="445" y1="967" x2="755" y2="967" class="image-border-thick" />
    </g>

    <g data-type="tag-status">
      <rect x="440" y="115" width="65" height="25" class="tag-good" />
      <text x="472.5" y="132" class="tag-text">GOOD</text>
    </g>

    <g data-type="headline-group">
      <text x="445" y="1010" font-size="25" class="headline">Uvumvummu Yuy</text>
      <text x="445" y="1045" font-size="25" class="headline">Vummu Yummmu</text>
    </g>

    <g data-type="columns">
      <rect x="445" y="1080" width="145" height="435" class="text-column" />
      <rect x="610" y="1080" width="145" height="435" class="text-column" />
    </g>
  </g>
</svg>
