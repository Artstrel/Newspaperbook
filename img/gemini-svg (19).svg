<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .layout-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-cross { stroke: #000000; stroke-width: 1.5; }
      .image-border-thick { stroke: #000000; stroke-width: 4; fill: none; }
      .headline { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: start; }
      .text-column { fill: #e0e0e0; stroke: none; }
      .tag-good { fill: #bf1e2e; }
      .tag-okay { fill: #d97706; }
      .tag-weak { fill: #7f1d1d; }
      .tag-text { fill: #ffffff; font-family: sans-serif; font-weight: bold; font-size: 12px; text-anchor: middle; }
    </style>
  </defs>

  <g id="layout-1" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-2" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-3" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-4" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-5" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-6" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>

  <g id="layout-7" data-type="layout" data-variant="flexible-dominant-left">
    <rect x="50" y="50" width="500" height="650" class="layout-bg" />
    
    <g data-type="tag-status">
      <rect x="50" y="70" width="65" height="25" class="tag-good" />
      <text x="82.5" y="87" class="tag-text">GOOD</text>
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="75" y="110" width="165" height="470" class="image-placeholder" />
      <line x1="75" y1="110" x2="240" y2="580" class="image-cross" />
      <line x1="240" y1="110" x2="75" y2="580" class="image-cross" />
      <line x1="75" y1="587" x2="240" y2="587" class="image-border-thick" />
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="260" y="75" width="265" height="175" class="image-placeholder" />
      <line x1="260" y1="75" x2="525" y2="250" class="image-cross" />
      <line x1="525" y1="75" x2="260" y2="250" class="image-cross" />
      <line x1="260" y1="257" x2="525" y2="257" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="260" y="290" font-size="20" class="headline">Umummuy uv</text>
      <text x="260" y="315" font-size="20" class="headline">vuvumumvuy</text>
    </g>

    <g data-type="columns">
      <rect x="260" y="340" width="120" height="240" class="text-column" />
      <rect x="405" y="340" width="120" height="240" class="text-column" />
    </g>
  </g>

  <g id="layout-8" data-type="layout" data-variant="flexible-raw-wrap">
    <rect x="650" y="50" width="500" height="650" class="layout-bg" />
    
    <g data-type="tag-status">
      <rect x="650" y="70" width="65" height="25" class="tag-okay" />
      <text x="682.5" y="87" class="tag-text">OKAY</text>
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="675" y="75" width="165" height="175" class="image-placeholder" />
      <line x1="675" y1="75" x2="840" y2="250" class="image-cross" />
      <line x1="840" y1="75" x2="675" y2="250" class="image-cross" />
      <line x1="675" y1="257" x2="840" y2="257" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="675" y="290" font-size="20" class="headline">Uvummuy uv</text>
      <text x="675" y="315" font-size="20" class="headline">vuvumumvuy</text>
    </g>

    <g data-type="columns" data-section="left-wrap">
      <rect x="675" y="340" width="75" height="240" class="text-column" />
      <rect x="765" y="340" width="75" height="240" class="text-column" />
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="860" y="75" width="165" height="470" class="image-placeholder" />
      <line x1="860" y1="75" x2="1025" y2="545" class="image-cross" />
      <line x1="1025" y1="75" x2="860" y2="545" class="image-cross" />
      <line x1="860" y1="552" x2="1025" y2="552" class="image-border-thick" />
    </g>

    <g data-type="columns" data-section="right-flank">
      <rect x="1045" y="75" width="80" height="505" class="text-column" />
    </g>
  </g>

  <g id="layout-9" data-type="layout" data-variant="template-proportional-l">
    <rect x="50" y="750" width="500" height="650" class="layout-bg" />
    
    <g data-type="tag-status">
      <rect x="50" y="770" width="65" height="25" class="tag-good" />
      <text x="82.5" y="787" class="tag-text">GOOD</text>
    </g>

    <g data-type="headline-group">
      <text x="125" y="792" font-size="18" class="headline">umuy uvumuyumu</text>
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="170" y="810" width="165" height="180" class="image-placeholder" />
      <line x1="170" y1="810" x2="335" y2="990" class="image-cross" />
      <line x1="335" y1="810" x2="170" y2="990" class="image-cross" />
      <line x1="170" y1="997" x2="335" y2="997" class="image-border-thick" />
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="350" y="775" width="175" height="465" class="image-placeholder" />
      <line x1="350" y1="775" x2="525" y2="1240" class="image-cross" />
      <line x1="525" y1="775" x2="350" y2="1240" class="image-cross" />
      <line x1="350" y1="1247" x2="525" y2="1247" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="75" y="815" width="80" height="520" class="text-column" />
      <rect x="170" y="1020" width="80" height="315" class="text-column" />
      <rect x="260" y="1020" width="80" height="315" class="text-column" />
    </g>
  </g>

  <g id="layout-10" data-type="layout" data-variant="scale-error-weak">
    <rect x="650" y="750" width="500" height="650" class="layout-bg" />
    
    <g data-type="tag-status">
      <rect x="650" y="770" width="65" height="25" class="tag-weak" />
      <text x="682.5" y="787" class="tag-text">WEAK</text>
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="675" y="810" width="175" height="430" class="image-placeholder" />
      <line x1="675" y1="810" x2="850" y2="1240" class="image-cross" />
      <line x1="850" y1="810" x2="675" y2="1240" class="image-cross" />
      <line x1="675" y1="1247" x2="850" y2="1247" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="865" y="792" font-size="18" class="headline">Uvummuy ummnvumvuy</text>
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="865" y="810" width="245" height="220" class="image-placeholder" />
      <line x1="865" y1="810" x2="1110" y2="1030" class="image-cross" />
      <line x1="1110" y1="810" x2="865" y2="1030" class="image-cross" />
      <line x1="865" y1="1037" x2="1110" y2="1037" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="865" y="1060" width="70" height="275" class="text-column" />
      <rect x="950" y="1060" width="70" height="275" class="text-column" />
      <rect x="1035" y="1060" width="70" height="275" class="text-column" />
    </g>
  </g>
</svg>
