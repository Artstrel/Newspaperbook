<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .layout-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-cross { stroke: #000000; stroke-width: 1.5; }
      .image-border-thick { stroke: #000000; stroke-width: 4; fill: none; }
      .headline { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: start; }
      .text-column { fill: #e0e0e0; stroke: none; }
      .tag-weak { fill: #7f1d1d; }
      .tag-text { fill: #ffffff; font-family: sans-serif; font-weight: bold; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>

  <g id="layout-1" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-2" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-3" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-4" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-5" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-6" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-7" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-8" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>

  <g id="layout-9" data-type="layout" data-status="empty"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>

  <g id="layout-10" data-type="layout" data-variant="faulty-vertical-stack-weak">
    <rect x="50" y="50" width="1100" height="1130" class="layout-bg" />
    
    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="125" y="115" width="950" height="570" class="image-placeholder" />
      <line x1="125" y1="115" x2="1075" y2="685" class="image-cross" />
      <line x1="1075" y1="115" x2="125" y2="685" class="image-cross" />
      <line x1="125" y1="692" x2="1075" y2="692" class="image-border-thick" />
    </g>

    <g data-type="tag-status">
      <rect x="50" y="145" width="115" height="50" class="tag-weak" />
      <text x="107.5" y="177" font-size="16" class="tag-text">WEAK</text>
    </g>

    <g data-type="headline-group">
      <text x="130" y="795" font-size="54" class="headline">Uvuvy uvyu</text>
      <text x="130" y="865" font-size="54" class="headline">vuy ummuv</text>
    </g>

    <g data-type="columns" data-position="bottom-left-wrap">
      <rect x="130" y="905" width="290" height="230" class="text-column" />
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="450" y="745" width="625" height="340" class="image-placeholder" />
      <line x1="450" y1="745" x2="1075" y2="1085" class="image-cross" />
      <line x1="1075" y1="745" x2="450" y2="1085" class="image-cross" />
      <line x1="450" y1="1092" x2="1075" y2="1092" class="image-border-thick" />
    </g>
  </g>
</svg>
