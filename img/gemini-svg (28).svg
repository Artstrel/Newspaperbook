<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .layout-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-cross { stroke: #000000; stroke-width: 1.5; }
      .image-border-thick { stroke: #000000; stroke-width: 4; fill: none; }
      .headline { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: start; }
      .text-column { fill: #e0e0e0; stroke: none; }
      .tag-good { fill: #bf1e2e; }
      .tag-okay { fill: #d97706; }
      .tag-text { fill: #ffffff; font-family: sans-serif; font-weight: bold; font-size: 11px; text-anchor: middle; }
      .caption-line { fill: #000000; stroke: none; }
      .empty-sidebar { fill: none; stroke: #a3a3a3; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <g id="layout-1" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-2" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-3" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-4" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-5" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-6" data-type="layout"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>

  <g id="layout-7" data-type="layout" data-variant="top-image-wrapped-bottom-right">
    <rect x="25" y="50" width="260" height="650" class="layout-bg" />
    
    <g data-type="tag-status">
      <rect x="25" y="85" width="55" height="22" class="tag-good" />
      <text x="52.5" y="100" class="tag-text">GOOD</text>
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="40" y="70" width="230" height="135" class="image-placeholder" />
      <line x1="40" y1="70" x2="270" y2="205" class="image-cross" />
      <line x1="270" y1="70" x2="40" y2="205" class="image-cross" />
      <line x1="40" y1="212" x2="270" y2="212" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="40" y="240" font-size="15" class="headline">Ummmmuyumu uyumuu</text>
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="135" y="260" width="110" height="90" class="image-placeholder" />
      <line x1="135" y1="260" x2="245" y2="350" class="image-cross" />
      <line x1="245" y1="260" x2="135" y2="350" class="image-cross" />
      <line x1="135" y1="357" x2="245" y2="357" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="40" y="260" width="40" height="360" class="text-column" />
      <rect x="88" y="260" width="40" height="360" class="text-column" />
      <rect x="135" y="375" width="50" height="245" class="text-column" />
      <rect x="195" y="375" width="50" height="245" class="text-column" />
      <rect x="252" y="260" width="18" height="360" class="text-column" />
    </g>
  </g>

  <g id="layout-8" data-type="layout" data-variant="top-image-side-captions-centered-bottom">
    <rect x="300" y="50" width="260" height="650" class="layout-bg" />
    
    <g data-type="tag-status">
      <rect x="300" y="85" width="55" height="22" class="tag-good" />
      <text x="327.5" y="100" class="tag-text">GOOD</text>
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="315" y="70" width="170" height="135" class="image-placeholder" />
      <line x1="315" y1="70" x2="485" y2="205" class="image-cross" />
      <line x1="485" y1="70" x2="315" y2="205" class="image-cross" />
    </g>

    <g data-type="captions" data-position="top-right-flank">
      <rect x="495" y="100" width="25" height="6" class="caption-line" />
      <rect x="495" y="112" width="25" height="6" class="caption-line" />
      <rect x="495" y="124" width="25" height="6" class="caption-line" />
      <rect x="495" y="136" width="25" height="6" class="caption-line" />
      <rect x="495" y="148" width="25" height="6" class="caption-line" />
      <rect x="495" y="160" width="25" height="6" class="caption-line" />
    </g>

    <g data-type="headline-group">
      <text x="315" y="240" font-size="15" class="headline">Uvummmuyumu uyumuu</text>
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="360" y="260" width="110" height="90" class="image-placeholder" />
      <line x1="360" y1="260" x2="470" y2="350" class="image-cross" />
      <line x1="470" y1="260" x2="360" y2="350" class="image-cross" />
      <line x1="360" y1="357" x2="470" y2="357" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="315" y="260" width="35" height="360" class="text-column" />
      <rect x="360" y="375" width="50" height="245" class="text-column" />
      <rect x="420" y="375" width="50" height="245" class="text-column" />
      <rect x="480" y="260" width="40" height="360" class="text-column" />
    </g>
  </g>

  <g id="layout-9" data-type="layout" data-variant="top-headline-asymmetric-multiphoto">
    <rect x="580" y="50" width="360" height="650" class="layout-bg" />
    
    <g data-type="headline-group">
      <text x="595" y="85" font-size="15" class="headline">Ummmmuyumu uyummvuyuvuvu</text>
    </g>

    <g data-type="tag-status">
      <rect x="580" y="100" width="55" height="22" class="tag-good" />
      <text x="607.5" y="115" class="tag-text">GOOD</text>
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="650" y="105" width="215" height="145" class="image-placeholder" />
      <line x1="650" y1="105" x2="865" y2="250" class="image-cross" />
      <line x1="865" y1="105" x2="650" y2="250" class="image-cross" />
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="695" y="265" width="125" height="95" class="image-placeholder" />
      <line x1="695" y1="265" x2="820" y2="360" class="image-cross" />
      <line x1="820" y1="265" x2="695" y2="360" class="image-cross" />
    </g>

    <g data-type="captions" data-position="mid-right-flank">
      <rect x="830" y="265" width="25" height="6" class="caption-line" />
      <rect x="830" y="277" width="25" height="6" class="caption-line" />
      <rect x="830" y="289" width="25" height="6" class="caption-line" />
      <rect x="830" y="301" width="25" height="6" class="caption-line" />
      <rect x="830" y="313" width="25" height="6" class="caption-line" />
    </g>

    <g data-type="columns" data-section="left-deep">
      <rect x="595" y="105" width="45" height="515" class="text-column" />
      <rect x="650" y="265" width="35" height="355" class="text-column" />
    </g>

    <g data-type="columns" data-section="center-bottom">
      <rect x="695" y="375" width="35" height="245" class="text-column" />
      <rect x="740" y="375" width="35" height="245" class="text-column" />
      <rect x="785" y="375" width="35" height="245" class="text-column" />
      <rect x="830" y="375" width="35" height="245" class="text-column" />
    </g>

    <g data-type="sidebar" class="sidebar-container">
      <rect x="875" y="105" width="45" height="515" class="empty-sidebar" />
    </g>
  </g>

  <g id="layout-10" data-type="layout" data-variant="horizontal-split-inline-head-weak">
    <rect x="960" y="50" width="210" height="650" class="layout-bg" />
    
    <g data-type="tag-status">
      <rect x="960" y="85" width="55" height="22" class="tag-okay" />
      <text x="987.5" y="100" class="tag-text">OKAY</text>
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="975" y="70" width="180" height="120" class="image-placeholder" />
      <line x1="975" y1="70" x2="1155" y2="190" class="image-cross" />
      <line x1="1155" y1="70" x2="975" y2="190" class="image-cross" />
      <line x1="975" y1="197" x2="1155" y2="197" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="975" y="230" font-size="14" class="headline">Uvummmuy</text>
      <text x="975" y="248" font-size="14" class="headline">umuv uvyuuvu</text>
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
      <rect x="1075" y="215" width="80" height="100" class="image-placeholder" />
      <line x1="1075" y1="215" x2="1155" y2="315" class="image-cross" />
      <line x1="1155" y1="215" x2="1075" y2="315" class="image-cross" />
      <line x1="1075" y1="322" x2="1155" y2="322" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="975" y="265" width="40" height="355" class="text-column" />
      <rect x="1025" y="265" width="40" height="355" class="text-column" />
      <rect x="1075" y="340" width="35" height="280" class="text-column" />
      <rect x="1120" y="340" width="35" height="280" class="text-column" />
    </g>
  </g>
</svg>
