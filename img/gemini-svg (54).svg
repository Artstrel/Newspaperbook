<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <style>
      .layout-bg { fill: #f8f9fa; stroke: #ccc; stroke-width: 1; }
      .headline { font-family: 'Arial Black', Impact, sans-serif; font-size: 26px; font-weight: 900; fill: #000; letter-spacing: -1px; }
      .caption { font-family: 'Georgia', serif; font-size: 16px; font-style: italic; fill: #000; }
      .image-placeholder { fill: #e9ecef; stroke: #343a40; stroke-width: 2; }
      .text-column-placeholder { fill: #dee2e6; opacity: 0.7; }
      .border-line { stroke: #000; stroke-width: 2; }
      .decorative-lines { stroke: #000; stroke-width: 1; }
      .thick-border { stroke: #000; stroke-width: 5; fill: none; }
    </style>
  </defs>

  <g id="layout-1" transform="translate(50, 50)">
    <rect x="0" y="0" width="500" height="500" class="layout-bg" />
    
    <g data-type="image" class="image-group">
      <rect x="20" y="20" width="320" height="420" class="image-placeholder" />
      <path d="M 40,300 C 60,200 120,100 200,150 C 250,180 280,250 250,320" fill="none" stroke="#6c757d" stroke-width="3" />
      <circle cx="150" cy="180" r="40" fill="#6c757d" opacity="0.3"/>
      <circle cx="210" cy="160" r="30" fill="#6c757d" opacity="0.3"/>
    </g>

    <line x1="20" y1="450" x2="340" y2="450" class="decorative-lines" />
    <line x1="20" y1="455" x2="340" y2="455" class="decorative-lines" />
    <line x1="20" y1="460" x2="340" y2="460" class="decorative-lines" />

    <g data-type="headline">
      <text x="355" y="45" class="headline">Seattle girl</text>
      <text x="355" y="75" class="headline">attacked</text>
      <text x="355" y="105" class="headline">by killer rat</text>
    </g>

    <g data-type="column" class="text-column">
      <rect x="355" y="130" width="125" height="310" class="text-column-placeholder" />
    </g>
  </g>

  <g id="layout-2" transform="translate(650, 50)">
    <rect x="0" y="0" width="500" height="500" class="layout-bg" />
    
    <rect x="10" y="10" width="480" height="480" class="thick-border" />

    <g data-type="image" class="image-group">
      <rect x="25" y="25" width="320" height="415" class="image-placeholder" />
      <path d="M 45,305 C 65,205 125,105 205,155 C 255,185 285,255 255,325" fill="none" stroke="#6c757d" stroke-width="3" />
      <circle cx="155" cy="185" r="40" fill="#6c757d" opacity="0.3"/>
      <circle cx="215" cy="165" r="30" fill="#6c757d" opacity="0.3"/>
    </g>

    <g data-type="caption">
      <text x="35" y="50" class="caption">Mickey says howdy!</text>
    </g>

    <line x1="25" y1="450" x2="345" y2="450" class="decorative-lines" stroke-width="2" />
    <line x1="25" y1="454" x2="345" y2="454" class="decorative-lines" />
    <line x1="25" y1="458" x2="345" y2="458" class="decorative-lines" />
    <line x1="25" y1="462" x2="345" y2="462" class="decorative-lines" />
    <line x1="25" y1="466" x2="345" y2="466" class="decorative-lines" />

    <g data-type="headline">
      <text x="360" y="50" class="headline">Seattle girl</text>
      <text x="360" y="80" class="headline">attacked</text>
      <text x="360" y="110" class="headline">by killer rat</text>
    </g>

    <g data-type="column" class="text-column">
      <rect x="360" y="135" width="115" height="305" class="text-column-placeholder" />
    </g>
  </g>
</svg>
