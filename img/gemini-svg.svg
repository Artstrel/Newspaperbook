      .image-placeholder { fill: none; stroke: #111111; stroke-width: 2; }
      .image-diagonal { stroke: #111111; stroke-width: 1.5; }
      .caption { fill: #111111; }
    </style>
  </defs>

  <g id="layout-1" data-type="layout-grid">
    <g data-type="headline-group">
      <text x="100" y="150" font-size="42" class="headline" data-type="headline">Uvuvuvuvuy uvuv uy vuvuy uvuvu yuvuvuv uvy</text>
    </g>

    <rect x="100" y="200" width="210" height="850" class="text-column" data-type="column" data-column-index="1" />

    <rect x="340" y="200" width="210" height="850" class="text-column" data-type="column" data-column-index="2" />

    <g data-type="image-container">
      <rect x="580" y="200" width="440" height="420" class="image-placeholder" data-type="image" />
      <line x1="580" y1="200" x2="1020" y2="620" class="image-diagonal" />
      <line x1="580" y1="620" x2="1020" y2="200" class="image-diagonal" />
    </g>

    <rect x="580" y="640" width="440" height="15" class="caption" data-type="caption" />

    <rect x="580" y="685" width="210" height="365" class="text-column" data-type="column" data-column-index="3" />

    <rect x="810" y="685" width="210" height="365" class="text-column" data-type="column" data-column-index="4" />
