<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .outer-border { fill: none; stroke: #111111; stroke-width: 2; }
      .headline { fill: #111111; font-family: sans-serif; font-weight: 900; }
      .badge-bg { fill: #b84335; }
      .badge-text { fill: #ffffff; font-family: sans-serif; font-weight: bold; }
      .text-column { fill: #dddddd; }
    </style>
  </defs>

  <g id="layout-2" data-type="layout-sidebar">
    <rect x="450" y="50" width="300" height="1500" class="outer-border" data-type="container" />

    <g data-type="headline-group">
      <text x="490" y="120" font-size="44" class="headline" data-type="headline">Uvuvuvu</text>
      <text x="490" y="175" font-size="44" class="headline" data-type="headline">vumvu</text>
      <text x="490" y="230" font-size="44" class="headline" data-type="headline">umuvy</text>
      <text x="490" y="285" font-size="44" class="headline" data-type="headline">umumu</text>
    </g>

    <g data-type="badge" class="badge-group">
      <rect x="420" y="330" width="170" height="70" class="badge-bg" data-type="badge-background" />
      <text x="450" y="378" font-size="34" class="badge-text" data-type="badge-label" letter-spacing="3">GOOD</text>
    </g>

    <rect x="490" y="430" width="220" height="1080" class="text-column" data-type="column" data-column-index="1" />
  </g>
</svg>
