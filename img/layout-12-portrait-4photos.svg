<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .layout-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-cross { stroke: #000000; stroke-width: 1.5; }
      .image-border-thick { stroke: #000000; stroke-width: 4; fill: none; }
      .headline { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: middle; }
      .headline-left { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: start; }
      .deck { fill: #000000; font-family: sans-serif; font-weight: bold; text-anchor: middle; }
      .deck-left { fill: #000000; font-family: sans-serif; font-weight: bold; text-anchor: start; }
      .text-column { fill: #e0e0e0; stroke: none; }
      .text-dummy { stroke: #000000; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <g id="layout-1" data-type="layout" data-variant="balanced-u-shape">
    <rect x="50" y="50" width="500" height="650" class="layout-bg" />
    
    <g data-type="image" class="image-container">
      <rect x="75" y="75" width="450" height="180" class="image-placeholder" />
      <line x1="75" y1="75" x2="525" y2="255" class="image-cross" />
      <line x1="525" y1="75" x2="75" y2="255" class="image-cross" />
      <line x1="75" y1="262" x2="525" y2="262" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="300" y="310" font-size="28" class="headline">UMUMUMU</text>
      <text x="300" y="340" font-size="28" class="headline">VUMUVUMV</text>
      <text x="300" y="365" font-size="12" class="deck">Umumumumum/Umumui</text>
      <text x="300" y="380" font-size="12" class="deck">UMUMUMUMUMUMUMMMM</text>
    </g>

    <g data-type="columns">
      <rect x="75" y="290" width="130" height="380" class="text-column" />
      <rect x="235" y="400" width="130" height="270" class="text-column" />
      <rect x="395" y="290" width="130" height="380" class="text-column" />
    </g>
  </g>

  <g id="layout-2" data-type="layout" data-variant="balanced-wrap">
    <rect x="650" y="50" width="500" height="650" class="layout-bg" />
    
    <g data-type="image" class="image-container">
      <rect x="675" y="75" width="450" height="180" class="image-placeholder" />
      <line x1="675" y1="75" x2="1125" y2="255" class="image-cross" />
      <line x1="1125" y1="75" x2="675" y2="255" class="image-cross" />
      <line x1="675" y1="262" x2="1125" y2="262" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="675" y="290" width="130" height="380" class="text-column" />
      <rect x="835" y="290" width="130" height="380" class="text-column" />
      <rect x="995" y="290" width="130" height="380" class="text-column" />
    </g>

    <g data-type="headline-group">
      <rect x="780" y="340" width="240" height="130" fill="#ffffff" />
      <text x="900" y="380" font-size="28" class="headline">VUMUMU</text>
      <text x="900" y="410" font-size="28" class="headline">UMUMU</text>
      <text x="900" y="435" font-size="12" class="deck">Umumumumuu</text>
      <text x="900" y="450" font-size="12" class="deck">Umumumuu</text>
    </g>
  </g>

  <g id="layout-3" data-type="layout" data-variant="sidesaddle-left">
    <rect x="50" y="750" width="500" height="650" class="layout-bg" />
    
    <g data-type="image" class="image-container">
      <rect x="75" y="775" width="450" height="180" class="image-placeholder" />
      <line x1="75" y1="775" x2="525" y2="955" class="image-cross" />
      <line x1="525" y1="775" x2="75" y2="955" class="image-cross" />
      <line x1="75" y1="962" x2="525" y2="962" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="75" y="1005" font-size="26" class="headline-left">UMUMU</text>
      <text x="75" y="1030" font-size="26" class="headline-left">UMUMU</text>
      <text x="75" y="1055" font-size="26" class="headline-left">UMUMU</text>
      
      <text x="75" y="1080" font-size="11" class="deck-left">Umumumuu</text>
      <text x="75" y="1092" font-size="11" class="deck-left">Vumumumui</text>
      <text x="75" y="1104" font-size="11" class="deck-left">vummmum</text>
      <text x="75" y="1116" font-size="11" class="deck-left">umumuu</text>
    </g>

    <g data-type="columns">
      <rect x="235" y="990" width="130" height="380" class="text-column" />
      <rect x="395" y="990" width="130" height="380" class="text-column" />
    </g>
  </g>

  <g id="layout-4" data-type="layout" data-variant="sidesaddle-stack">
    <rect x="650" y="750" width="500" height="650" class="layout-bg" />
    
    <g data-type="headline-group">
      <text x="675" y="790" font-size="26" class="headline-left">UMUMU</text>
      <text x="675" y="815" font-size="22" class="headline-left">UVUVUV</text>
      <text x="675" y="840" font-size="26" class="headline-left">UMUMU</text>
      
      <text x="675" y="865" font-size="11" class="deck-left">Umumuu</text>
      <text x="675" y="877" font-size="11" class="deck-left">ummmmu</text>
      <text x="675" y="889" font-size="11" class="deck-left">mymmuu</text>
    </g>

    <g data-type="image" class="image-container">
      <rect x="835" y="765" width="290" height="180" class="image-placeholder" />
      <line x1="835" y1="765" x2="1125" y2="945" class="image-cross" />
      <line x1="1125" y1="765" x2="835" y2="945" class="image-cross" />
      <line x1="835" y1="952" x2="1125" y2="952" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="675" y="975" width="130" height="395" class="text-column" />
      <rect x="835" y="975" width="130" height="395" class="text-column" />
      <rect x="995" y="975" width="130" height="395" class="text-column" />
    </g>
  </g>

  <g id="layout-5" data-type="layout" data-status="empty">
    </g>

  <g id="layout-6" data-type="layout" data-status="empty">
    </g>

  <g id="layout-7" data-type="layout" data-status="empty">
    </g>

  <g id="layout-8" data-type="layout" data-status="empty">
    </g>

  <g id="layout-9" data-type="layout" data-status="empty">
    </g>

  <g id="layout-10" data-type="layout" data-status="empty">
    </g>
</svg>
