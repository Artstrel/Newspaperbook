    <g data-type="headline-group">
      <text x="75" y="805" font-size="24" class="headline">UVUMUVUVUYY</text>
      <text x="75" y="835" font-size="24" class="headline">UVUVUYVUMUV</text>
    </g>

    <g data-type="tag-status">
      <rect x="50" y="860" width="65" height="25" class="tag-okay" />
      <text x="82.5" y="877" class="tag-text">OKAY</text>
    </g>

    <g data-type="image" class="image-container">
      <rect x="315" y="775" width="210" height="180" class="image-placeholder" />
      <line x1="315" y1="775" x2="525" y2="955" class="image-cross" />
      <line x1="525" y1="775" x2="315" y2="955" class="image-cross" />
      <line x1="315" y1="962" x2="525" y2="962" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="75" y="900" width="100" height="465" class="text-column" />
      <rect x="195" y="900" width="100" height="465" class="text-column" />
      <rect x="315" y="985" width="100" height="380" class="text-column" />
      <rect x="435" y="985" width="100" height="380" class="text-column" />
    </g>
  </g>

  <g id="layout-8" data-type="layout" data-variant="text-wrap-weak">
    <rect x="650" y="750" width="500" height="650" class="layout-bg" />
    
    <g data-type="headline-group">
      <text x="675" y="785" font-size="20" class="headline">UVUMUVUVUY UMUVUYVUMUV UMUV</text>
    </g>

    <g data-type="tag-status">
      <rect x="650" y="805" width="65" height="25" class="tag-weak" />
      <text x="682.5" y="822" class="tag-text">WEAK</text>
    </g>

    <g data-type="image" class="image-container">
      <rect x="675" y="845" width="210" height="130" class="image-placeholder" />
      <line x1="675" y1="845" x2="885" y2="975" class="image-cross" />
      <line x1="885" y1="845" x2="675" y2="975" class="image-cross" />
      <line x1="675" y1="982" x2="885" y2="982" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="675" y="1015" font-size="18" class="headline">UVUMUVUVUY UMUVUYVUMUV UVUMUVUVU</text>
    </g>

    <g data-type="image" class="image-container">
      <rect x="795" y="1110" width="210" height="130" class="image-placeholder" />
      <line x1="795" y1="1110" x2="1005" y2="1240" class="image-cross" />
      <line x1="1005" y1="1110" x2="795" y2="1240" class="image-cross" />
      <line x1="795" y1="1247" x2="1005" y2="1247" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="915" y="810" width="100" height="165" class="text-column" />
      <rect x="1035" y="810" width="100" height="165" class="text-column" />
      
      <rect x="675" y="1040" width="100" height="320" class="text-column" />
      <rect x="795" y="1040" width="100" height="55" class="text-column" />
      <rect x="915" y="1040" width="100" height="55" class="text-column" />
      <rect x="1035" y="1040" width="100" height="320" class="text-column" />
      
      <rect x="795" y="1260" width="100" height="100" class="text-column" />
      <rect x="915" y="1260" width="100" height="100" class="text-column" />
    </g>
  </g>

  <g id="layout-9" data-type="layout" data-status="empty">
    </g>

  <g id="layout-10" data-type="layout" data-status="empty">
    </g>
</svg>
