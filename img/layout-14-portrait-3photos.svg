<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .layout-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-cross { stroke: #000000; stroke-width: 1.5; }
      .image-border-thick { stroke: #000000; stroke-width: 4; fill: none; }
      .headline { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: start; }
      .text-column { fill: #e0e0e0; stroke: none; }
      .tag-good { fill: #bf1e2e; }
      .tag-okay { fill: #d97706; }
      .tag-weak { fill: #7f1d1d; }
      .tag-text { fill: #ffffff; font-family: sans-serif; font-weight: bold; font-size: 12px; text-anchor: middle; }
    </style>
  </defs>

  <g id="layout-1" data-type="layout" data-variant="balanced-u-shape">
    <rect x="50" y="50" width="220" height="300" fill="none" opacity="0" />
  </g>

  <g id="layout-2" data-type="layout" data-variant="balanced-wrap">
    <rect x="320" y="50" width="220" height="300" fill="none" opacity="0" />
  </g>

  <g id="layout-3" data-type="layout" data-variant="sidesaddle-left">
    <rect x="50" y="400" width="220" height="300" fill="none" opacity="0" />
  </g>

  <g id="layout-4" data-type="layout" data-variant="sidesaddle-stack">
    <rect x="320" y="400" width="220" height="300" fill="none" opacity="0" />
  </g>

  <g id="layout-5" data-type="layout" data-variant="l-shape">
    <rect x="50" y="50" width="500" height="650" fill="none" opacity="0" />
  </g>

  <g id="layout-6" data-type="layout" data-variant="u-shape">
    <rect x="650" y="50" width="500" height="650" fill="none" opacity="0" />
  </g>

  <g id="layout-7" data-type="layout" data-variant="raw-wrap">
    <rect x="50" y="750" width="500" height="650" fill="none" opacity="0" />
  </g>

  <g id="layout-8" data-type="layout" data-variant="text-wrap-weak">
    <rect x="650" y="750" width="500" height="650" fill="none" opacity="0" />
  </g>

  <g id="layout-9" data-type="layout" data-variant="risky-top-image">
    <rect x="50" y="50" width="320" height="1100" class="layout-bg" />
    
    <g data-type="headline-group">
      <text x="75" y="110" font-size="28" class="headline">UmMmMmuw</text>
      <text x="75" y="150" font-size="28" class="headline">uvuyVMMMuuy</text>
    </g>

    <g data-type="tag-status">
      <rect x="35" y="180" width="95" height="30" class="tag-weak" />
      <text x="82.5" y="200" class="tag-text">RISKY</text>
    </g>

    <g data-type="image" class="image-container">
      <rect x="75" y="210" width="270" height="420" class="image-placeholder" />
      <line x1="75" y1="210" x2="345" y2="630" class="image-cross" />
      <line x1="345" y1="210" x2="75" y2="630" class="image-cross" />
      <line x1="75" y1="638" x2="345" y2="638" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="75" y="665" width="120" height="440" class="text-column" />
      <rect x="225" y="665" width="120" height="440" class="text-column" />
    </g>
  </g>

  <g id="layout-10" data-type="layout" data-variant="risky-bottom-image">
    <rect x="420" y="50" width="320" height="1100" class="layout-bg" />
    
    <g data-type="headline-group">
      <text x="445" y="110" font-size="28" class="headline">UmMmMmuw</text>
      <text x="445" y="150" font-size="28" class="headline">uvuyVMMMuuy</text>
    </g>

    <g data-type="tag-status">
      <rect x="405" y="180" width="95" height="30" class="tag-weak" />
      <text x="452.5" y="200" class="tag-text">RISKY</text>
    </g>

    <g data-type="columns">
      <rect x="445" y="210" width="120" height="350" class="text-column" />
      <rect x="595" y="210" width="120" height="350" class="text-column" />
    </g>

    <g data-type="image" class="image-container">
      <rect x="445" y="585" width="270" height="420" class="image-placeholder" />
      <line x1="445" y1="585" x2="715" y2="1005" class="image-cross" />
      <line x1="715" y1="585" x2="445" y2="1005" class="image-cross" />
      <line x1="445" y1="1013" x2="715" y2="1013" class="image-border-thick" />
    </g>
  </g>

  <g id="layout-11" data-type="layout" data-variant="weak-middle-image">
    <rect x="790" y="50" width="320" height="1100" class="layout-bg" />
    
    <g data-type="headline-group">
      <text x="815" y="110" font-size="28" class="headline">UmMmMmuw</text>
      <text x="815" y="150" font-size="28" class="headline">uvuyVMMMuuy</text>
    </g>

    <g data-type="tag-status">
      <rect x="775" y="180" width="95" height="30" class="tag-weak" />
      <text x="822.5" y="200" class="tag-text">WEAK</text>
    </g>

    <g data-type="columns" data-section="upper">
      <rect x="815" y="210" width="120" height="120" class="text-column" />
      <rect x="965" y="210" width="120" height="120" class="text-column" />
    </g>

    <g data-type="image" class="image-container">
      <rect x="815" y="355" width="270" height="420" class="image-placeholder" />
      <line x1="815" y1="355" x2="1085" y2="775" class="image-cross" />
      <line x1="1085" y1="355" x2="815" y2="775" class="image-cross" />
      <line x1="815" y1="782" x2="1085" y2="782" class="image-border-thick" />
    </g>

    <g data-type="columns" data-section="lower">
      <rect x="815" y="810" width="120" height="250" class="text-column" />
      <rect x="965" y="810" width="120" height="250" class="text-column" />
    </g>
  </g>
</svg>
