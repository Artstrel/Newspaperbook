<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <style>
      .layout-frame { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-cross { stroke: #000000; stroke-width: 1.5; }
      .image-border-thick { stroke: #000000; stroke-width: 4; fill: none; }
      .headline { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: middle; }
      .headline-left { fill: #000000; font-family: sans-serif; font-weight: 900; text-anchor: start; }
      .deck { fill: #000000; font-family: sans-serif; font-weight: bold; text-anchor: middle; }
      .deck-left { fill: #000000; font-family: sans-serif; font-weight: bold; text-anchor: start; }
      .text-column { fill: #e0e0e0; stroke: none; }
      .caption-block { fill: #1a1a1a; stroke: none; }
    </style>
  </defs>

  <g id="layout-1" data-type="layout" data-variant="balanced-top-image">
    <rect x="50" y="50" width="500" height="650" class="layout-frame" />
    
    <g data-type="image" class="image-container">
      <rect x="180" y="75" width="240" height="350" class="image-placeholder" />
      <line x1="180" y1="75" x2="420" y2="425" class="image-cross" />
      <line x1="420" y1="75" x2="180" y2="425" class="image-cross" />
      <line x1="180" y1="432" x2="420" y2="432" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="300" y="475" font-size="26" class="headline">UVUVU UV</text>
      <text x="300" y="500" font-size="11" class="deck">Umumumumumuumuy</text>
      <text x="300" y="515" font-size="11" class="deck">Vumumumumumum</text>
    </g>

    <g data-type="columns">
      <rect x="75" y="75" width="85" height="600" class="text-column" />
      <rect x="180" y="535" width="110" height="140" class="text-column" />
      <rect x="310" y="535" width="110" height="140" class="text-column" />
      <rect x="440" y="75" width="85" height="600" class="text-column" />
    </g>
  </g>

  <g id="layout-2" data-type="layout" data-variant="balanced-top-headline">
    <rect x="650" y="50" width="500" height="650" class="layout-frame" />
    
    <g data-type="headline-group">
      <text x="900" y="105" font-size="26" class="headline">UVU UVUV</text>
      <text x="900" y="128" font-size="11" class="deck">UmumumumumVmui</text>
      <text x="900" y="142" font-size="11" class="deck">Vumumumuum</text>
    </g>

    <g data-type="image" class="image-container">
      <rect x="775" y="160" width="250" height="350" class="image-placeholder" />
      <line x1="775" y1="160" x2="1025" y2="510" class="image-cross" />
      <line x1="1025" y1="160" x2="775" y2="510" class="image-cross" />
      <line x1="775" y1="517" x2="1025" y2="517" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="675" y="75" width="80" height="600" class="text-column" />
      <rect x="775" y="535" width="115" height="140" class="text-column" />
      <rect x="910" y="535" width="115" height="140" class="text-column" />
      <rect x="1045" y="75" width="80" height="600" class="text-column" />
    </g>
  </g>

  <g id="layout-3" data-type="layout" data-variant="sidesaddle-white-space">
    <rect x="50" y="750" width="500" height="650" class="layout-frame" />
    
    <g data-type="headline-group">
      <text x="75" y="805" font-size="24" class="headline-left">UVUVUV</text>
      <text x="75" y="830" font-size="24" class="headline-left">VUVU</text>
      <text x="75" y="855" font-size="24" class="headline-left">UVVUVUV</text>
      
      <text x="75" y="885" font-size="11" class="deck-left">Ukumuyimmui</text>
      <text x="75" y="897" font-size="11" class="deck-left">uyVMMMuuy uMuv</text>
      <text x="75" y="909" font-size="11" class="deck-left">vummmumumu Vui</text>
      <text x="75" y="921" font-size="11" class="deck-left">umumumumuum</text>
    </g>

    <g data-type="image" class="image-container">
      <rect x="270" y="775" width="220" height="350" class="image-placeholder" />
      <line x1="270" y1="775" x2="490" y2="1125" class="image-cross" />
      <line x1="490" y1="775" x2="270" y2="1125" class="image-cross" />
    </g>

    <g data-type="captions">
      <rect x="500" y="930" width="20" height="10" class="caption-block" />
      <rect x="500" y="945" width="20" height="10" class="caption-block" />
      <rect x="500" y="960" width="20" height="10" class="caption-block" />
      <rect x="500" y="975" width="20" height="10" class="caption-block" />
      <rect x="500" y="990" width="20" height="10" class="caption-block" />
    </g>

    <g data-type="columns">
      <rect x="75" y="1150" width="100" height="220" class="text-column" />
      <rect x="190" y="1150" width="100" height="220" class="text-column" />
      <rect x="305" y="1150" width="100" height="220" class="text-column" />
      <rect x="420" y="1150" width="100" height="220" class="text-column" />
    </g>
  </g>

  <g id="layout-4" data-type="layout" data-variant="tucked-in-risky">
    <rect x="650" y="750" width="500" height="650" class="layout-frame" />
    
    <g data-type="columns" data-position="left-flank">
      <rect x="675" y="775" width="100" height="595" class="text-column" />
    </g>

    <g data-type="headline-group">
      <text x="790" y="805" font-size="22" class="headline-left">UVUVU</text>
      <text x="790" y="827" font-size="22" class="headline-left">VUVUV</text>
      <text x="790" y="849" font-size="22" class="headline-left">VUVU</text>
      <text x="790" y="871" font-size="22" class="headline-left">UVUVU</text>
      
      <text x="790" y="895" font-size="10" class="deck-left">Umumumuy</text>
      <text x="790" y="907" font-size="10" class="deck-left">ummmmuuy</text>
      <text x="790" y="919" font-size="10" class="deck-left">ummmmuuy</text>
      <text x="790" y="931" font-size="10" class="deck-left">vummmmu</text>
    </g>

    <g data-type="image" class="image-container">
      <rect x="915" y="775" width="210" height="470" class="image-placeholder" />
      <line x1="915" y1="775" x2="1125" y2="1245" class="image-cross" />
      <line x1="1125" y1="775" x2="915" y2="1245" class="image-cross" />
    </g>

    <g data-type="caption-group">
      <text x="1020" y="1265" font-size="10" class="deck">Umumumumumvui</text>
      <text x="1020" y="1277" font-size="10" class="deck">uyvuy uyumuyuy</text>
      <text x="1020" y="1289" font-size="10" class="deck">umvumumvuy yuv</text>
    </g>

    <g data-type="columns" data-position="center-tucked">
      <rect x="790" y="955" width="110" height="415" class="text-column" />
    </g>
  </g>

  <g id="layout-5" data-type="layout" data-status="empty"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-6" data-type="layout" data-status="empty"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-7" data-type="layout" data-status="empty"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-8" data-type="layout" data-status="empty"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-9" data-type="layout" data-status="empty"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
  <g id="layout-10" data-type="layout" data-status="empty"><rect x="0" y="0" width="1" height="1" fill="none" opacity="0"/></g>
</svg>
