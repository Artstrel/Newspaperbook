      <rect x="320" y="700" width="50" height="140" class="text-column" />
      <rect x="385" y="590" width="50" height="250" class="text-column" />
    </g>

    <path d="M 330,880 C 330,910 350,915 370,915 L 370,900 L 405,925 L 370,950 L 370,935 C 350,935 330,930 330,880 Z" class="flow-arrow" />
  </g>

  <g id="layout-9" data-type="layout" data-variant="vertical-options-c">
