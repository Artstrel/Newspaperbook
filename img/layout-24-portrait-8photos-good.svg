      <text x="77.5" y="80" class="tag-text">GOOD</text>
    </g>

    <g data-type="image" data-importance="primary" class="image-container">
      <rect x="75" y="75" width="165" height="300" class="image-placeholder" />
      <line x1="75" y1="75" x2="240" y2="375" class="image-cross" />
      <line x1="240" y1="75" x2="75" y2="375" class="image-cross" />
      <line x1="75" y1="382" x2="240" y2="382" class="image-border-thick" />
    </g>

    <g data-type="headline-group">
      <text x="255" y="90" font-size="14" class="headline">Uvummuv vuylmi</text>
      <text x="255" y="108" font-size="14" class="headline">ummuv ummmmuy</text>
    </g>

    <g data-type="image" data-importance="secondary" class="image-container">
