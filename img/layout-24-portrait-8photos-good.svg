      <line x1="860" y1="1280" x2="925" y2="1400" class="image-cross" />
      <line x1="925" y1="1280" x2="860" y2="1400" class="image-cross" />
      <line x1="860" y1="1407" x2="925" y2="1407" class="image-border-thick" />
    </g>

    <g data-type="columns">
      <rect x="625" y="1035" width="45" height="520" class="text-column" />
      <rect x="680" y="1035" width="45" height="520" class="text-column" />
      <rect x="735" y="1035" width="45" height="520" class="text-column" />
      <rect x="790" y="1280" width="60" height="275" class="text-column" />
      <rect x="860" y="1425" width="65" height="130" class="text-column" />
      <rect x="945" y="1035" width="45" height="520" class="text-column" />
