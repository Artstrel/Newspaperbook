      <rect x="315" y="315" width="45" height="60" class="text-column" />
      <rect x="380" y="315" width="45" height="60" class="text-column" />
    </g>

    <path d="M 330,410 C 330,440 350,445 370,445 L 370,430 L 405,455 L 370,480 L 370,465 C 350,465 330,460 330,410 Z" class="flow-arrow" />
  </g>

  <g id="layout-8" data-type="layout" data-variant="vertical-options-b">
