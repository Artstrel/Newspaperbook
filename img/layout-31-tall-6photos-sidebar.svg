<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 4000" width="100%" height="100%">
  <style>
    .layout-bg { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 3; }
    .image-diagonal { stroke: #000000; stroke-width: 2; }
    .headline { fill: #000000; }
    .text-line { fill: #4a4a4a; font-family: monospace; }
    .text-column { fill: #d3d3d3; stroke: none; }
    .bullet-bar { fill: #000000; }
  </style>

  <g id="layout-1" transform="translate(0, 0)" data-type="layout-template">
    <rect x="50" y="50" width="1100" height="1200" class="layout-bg" />
    
    <g data-type="image" data-role="hero">
      <rect x="100" y="100" width="1000" height="400" class="image-placeholder" />
      <line x1="100" y1="100" x2="1100" y2="500" class="image-diagonal" />
      <line x1="100" y1="500" x2="1100" y2="100" class="image-diagonal" />
    </g>

    <g data-type="typography" data-role="header-group">
      <path d="M 100,560 L 480,560 L 480,590 L 100,590 Z M 100,605 L 450,605 L 450,635 L 100,635 Z" class="headline" />
      <rect x="100" y="660" width="400" height="12" class="text-line" />
      <rect x="100" y="685" width="370" height="12" class="text-line" />
    </g>

    <g data-type="image" data-role="secondary">
      <rect x="550" y="560" width="350" height="240" class="image-placeholder" />
      <line x1="550" y1="560" x2="900" y2="800" class="image-diagonal" />
      <line x1="550" y1="800" x2="900" y2="560" class="image-diagonal" />
    </g>
    <g data-type="sidebar" data-role="menu">
      <rect x="930" y="560" width="60" height="15" class="bullet-bar" />
      <rect x="930" y="585" width="60" height="15" class="bullet-bar" />
      <rect x="930" y="610" width="60" height="15" class="bullet-bar" />
      <rect x="930" y="635" width="60" height="15" class="bullet-bar" />
      <rect x="930" y="660" width="60" height="15" class="bullet-bar" />
    </g>

    <g data-type="content-grid" data-role="text-columns">
      <rect x="100" y="850" width="220" height="320" class="text-column" />
      <rect x="360" y="850" width="220" height="320" class="text-column" />
      <rect x="620" y="850" width="220" height="320" class="text-column" />
      <rect x="880" y="220" width="220" height="320" class="text-column" transform="translate(0, 630)" />
    </g>
  </g>

  <g id="layout-2" transform="translate(0, 1350)" data-type="layout-template">
    <rect x="50" y="50" width="1100" height="1200" class="layout-bg" />

    <g data-type="typography" data-role="header-group">
      <path d="M 100,100 L 400,100 L 400,130 L 100,130 Z M 100,145 L 420,145 L 420,175 L 100,175 Z M 100,190 L 380,190 L 380,220 L 100,220 Z" class="headline" />
      <rect x="100" y="250" width="340" height="12" class="text-line" />
      <rect x="100" y="275" width="280" height="12" class="text-line" />
    </g>

    <g data-type="image" data-role="hero">
      <rect x="470" y="100" width="630" height="420" class="image-placeholder" />
      <line x1="470" y1="100" x2="1100" y2="520" class="image-diagonal" />
      <line x1="470" y1="520" x2="1100" y2="100" class="image-diagonal" />
    </g>

    <g data-type="content-grid" data-role="text-columns-primary">
      <rect x="100" y="560" width="100" height="630" class="text-column" />
      <rect x="220" y="560" width="100" height="630" class="text-column" />
      <rect x="340" y="560" width="100" height="630" class="text-column" />
    </g>

    <g data-type="sidebar" data-role="secondary-content">
      <rect x="470" y="550" width="630" height="20" class="bullet-bar" />
      <rect x="470" y="580" width="630" height="20" class="bullet-bar" />
      
      <g data-type="image" data-role="sub-hero">
        <rect x="650" y="620" width="450" height="250" class="image-placeholder" />
        <line x1="650" y1="620" x2="1100" y2="870" class="image-diagonal" />
        <line x1="650" y1="870" x2="1100" y2="620" class="image-diagonal" />
      </g>

      <rect x="650" y="890" width="210" height="300" class="text-column" />
      <rect x="890" y="890" width="210" height="300" class="text-column" />
    </g>
  </g>

  <g id="layout-3" transform="translate(0, 2700)" data-type="layout-template">
    <rect x="50" y="50" width="1100" height="1200" class="layout-bg" />

    <g data-type="image" data-role="hero">
      <rect x="100" y="100" width="850" height="450" class="image-placeholder" />
      <line x1="100" y1="100" x2="950" y2="550" class="image-diagonal" />
      <line x1="100" y1="550" x2="950" y2="100" class="image-diagonal" />
    </g>

    <g data-type="sidebar" data-role="status-stack">
      <rect x="980" y="240" width="50" height="15" class="bullet-bar" />
      <rect x="980" y="265" width="50" height="15" class="bullet-bar" />
      <rect x="980" y="290" width="50" height="15" class="bullet-bar" />
      <rect x="980" y="315" width="50" height="15" class="bullet-bar" />
      <rect x="980" y="340" width="50" height="15" class="bullet-bar" />
      <rect x="980" y="365" width="50" height="15" class="bullet-bar" />
      <rect x="980" y="390" width="50" height="15" class="bullet-bar" />
    </g>

    <g data-type="typography" data-role="header-group">
      <path d="M 100,590 L 490,590 L 490,620 L 100,620 Z" class="headline" />
      <rect x="100" y="645" width="410" height="12" class="text-line" />
      <rect x="100" y="670" width="390" height="12" class="text-line" />
    </g>

    <g data-type="image" data-role="secondary">
      <rect x="550" y="560" width="450" height="230" class="image-placeholder" />
      <line x1="550" y1="560" x2="1000" y2="790" class="image-diagonal" />
      <line x1="550" y1="790" x2="1000" y2="560" class="image-diagonal" />
    </g>

    <g data-type="content-grid" data-role="text-columns">
      <rect x="100" y="830" width="220" height="340" class="text-column" />
      <rect x="360" y="830" width="220" height="340" class="text-column" />
      <rect x="620" y="830" width="220" height="340" class="text-column" />
      <rect x="880" y="830" width="220" height="340" class="text-column" />
    </g>
  </g>
</svg>
