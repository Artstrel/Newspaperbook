<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .layout-bg { fill: #F4F4F4; stroke: #A0A0A0; stroke-width: 1.5; }
      .text-column { fill: #E1E1E1; opacity: 0.85; }
      .border-box { fill: none; stroke: #1A1A1A; stroke-width: 2; }
      
      .label-good { fill: #D32F2F; }
      .label-text { fill: #FFFFFF; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: bold; font-size: 15px; letter-spacing: 0.5px; }
      
      .headline { fill: #000000; font-family: 'Times New Roman', Times, serif; font-weight: 900; }
      .subhead { fill: #222222; font-family: 'Times New Roman', Times, serif; font-weight: bold; font-style: italic; }
      .text-mock { fill: #555555; font-family: 'Times New Roman', Times, serif; font-weight: bold; }
      
      .liftout-quote-box { fill: #FFFFFF; stroke: #A0A0A0; stroke-width: 1; stroke-dasharray: 2,2; }
      .quote-text { fill: #1A1A1A; font-family: 'Times New Roman', Times, serif; font-style: italic; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="900" class="bg" />

