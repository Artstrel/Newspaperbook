<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <style>
      .layout-bg { fill: #f0f0f0; stroke: #cccccc; stroke-width: 1; }
      .badge-weak { fill: #d91414; }
      .badge-good { fill: #008a1a; }
      .badge-text { fill: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
      .image-placeholder { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .image-diagonal { stroke: #000000; stroke-width: 1.5; fill: none; }
      .headline-text { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 28px; fill: #000000; letter-spacing: -0.5px; }
      .text-line { stroke: #7a7a7a; stroke-width: 2; stroke-linecap: round; }
      .caption-line { stroke: #555555; stroke-width: 4; }
    </style>
  </defs>

